[package]
name = "inshellisense-rs"
version = "0.0.3"
edition = "2021"
description = "Rust port of inshellisense: IDE-style autocomplete as ghost text for your shell"
license = "MIT"
authors = ["Fara Technologies LLC"]

[[bin]]
name = "is"
path = "src/main.rs"

[[bin]]
name = "parity-scan"
path = "src/bin/parity_scan.rs"

[dependencies]
vt100 = { package = "vt100-ctt", version = "0.17", default-features = false }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
toml = "1"
libc = "0.2"
unicode-width = "0.2"
ruzstd = "0.8"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_Storage_FileSystem",
] }

[features]
default = []

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
