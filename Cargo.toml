[package]
name = "inshellisense-rs"
version = "0.0.1"
edition = "2021"
description = "Rust port of inshellisense: IDE-style autocomplete as ghost text for your shell"
license = "MIT"
authors = ["Fara Technologies LLC"]

[[bin]]
name = "is"
path = "src/main.rs"

[[bin]]
name = "parity-scan"
path = "src/bin/parity_scan.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
portable-pty = "0.9"
vt100 = { package = "vt100-ctt", version = "0.17", default-features = false }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
libc = "0.2"
unicode-width = "0.2"
ruzstd = "0.8"
rayon = "1"

[features]
default = []

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
